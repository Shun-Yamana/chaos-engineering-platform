---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-target
  namespace: test
  labels:
    app: nginx-target
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-target
  namespace: test
spec:
  selector:
    app: nginx-target
  ports:
    - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: test
  labels:
    app: client
spec:
  containers:
    - name: client
      image: alpine:3.19
      command: ["sh", "-c", "apk add --no-cache curl && sleep 3600"]
