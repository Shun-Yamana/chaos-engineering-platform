---
apiVersion: v1
kind: Service
metadata:
  name: service-a-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: service-a
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator-script
  namespace: default
data:
  run.py: |
    import socket, http.client, time, random, os, logging

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(message)s")
    log = logging.getLogger(__name__)

    # ヘッドレスサービス経由で pod IP を直接取得 (VPC CNI ClusterIP 制限を回避)
    HEADLESS = os.environ.get("TARGET_HEADLESS", "service-a-headless.default.svc.cluster.local")
    PORT = int(os.environ.get("TARGET_PORT", "8000"))
    RPS  = int(os.environ.get("TARGET_RPS", "20"))

    def get_pod_ip():
        try:
            return socket.gethostbyname(HEADLESS)
        except Exception:
            return None

    log.info(f"traffic-generator started: {HEADLESS}:{PORT} @ {RPS} req/s")

    while True:
        t0 = time.monotonic()
        ok = err = 0
        ip = get_pod_ip()
        for _ in range(RPS):
            pid = random.choice(["p-001", "p-002", "p-003"])
            try:
                conn = http.client.HTTPConnection(ip or HEADLESS, PORT, timeout=3)
                conn.request("GET", f"/aggregate/products/{pid}")
                resp = conn.getresponse()
                resp.read()
                conn.close()
                ok += 1
            except Exception:
                err += 1
        elapsed = time.monotonic() - t0
        log.info(f"ip={ip} ok={ok} err={err} elapsed={elapsed:.2f}s")
        if elapsed < 1.0:
            time.sleep(1.0 - elapsed)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: default
spec:
  replicas: 0
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: traffic-generator-script
      containers:
        - name: traffic-generator
          image: python:3.13-slim
          command: ["python", "/scripts/run.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
          env:
            - name: TARGET_HOST
              value: "service-a.default.svc.cluster.local"
            - name: TARGET_PORT
              value: "8000"
            - name: TARGET_RPS
              value: "20"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
