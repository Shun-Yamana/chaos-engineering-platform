# RBAC for FIS EKS actions (pod-delete, pod-cpu-stress, pod-memory-stress, pod-network-latency)
# FIS pod runs as system:serviceaccount:default:default and needs:
#   - ConfigMap create/get/patch (fisconfigmap-* for coordination)
#   - Pod get/list/delete (pod-delete action)
#   - Pod exec (cpu-stress / memory-stress inject stress-ng into target pod)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-agent
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-agent
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: fis-agent
  apiGroup: rbac.authorization.k8s.io
