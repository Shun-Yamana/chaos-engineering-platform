# CHAOS_AGENT_ROLE_ARN / FIS_TEMPLATE_* / TABLE_NAME は
# terraform apply 後に CI/CD で kubectl set env により設定する
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-agent
  namespace: chaos
  annotations:
    eks.amazonaws.com/role-arn: CHAOS_AGENT_ROLE_ARN
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-agent
subjects:
  - kind: ServiceAccount
    name: chaos-agent
    namespace: chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-agent
  namespace: chaos
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: chaos-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: chaos-agent
    spec:
      serviceAccountName: chaos-agent
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chaos-agent
          image: CHAOS_AGENT_IMAGE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: FIS_TEMPLATE_SERVICE_A
              value: PLACEHOLDER_FIS_TEMPLATE_SERVICE_A
            - name: FIS_TEMPLATE_SERVICE_B
              value: PLACEHOLDER_FIS_TEMPLATE_SERVICE_B
            - name: TABLE_NAME
              value: PLACEHOLDER_TABLE_NAME
            - name: AWS_REGION
              value: ap-northeast-1
          resources:
            requests:
              cpu: "64m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"
