# CHAOS_AGENT_ROLE_ARN / FIS_TEMPLATE_* / TABLE_NAME は
# terraform apply 後に CI/CD で kubectl set env により設定する
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-agent
  namespace: chaos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::203553641035:role/chaos-agent-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-agent
subjects:
  - kind: ServiceAccount
    name: chaos-agent
    namespace: chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-agent
  namespace: chaos
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: chaos-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: chaos-agent
    spec:
      serviceAccountName: chaos-agent
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: chaos-agent
          image: CHAOS_AGENT_IMAGE
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: TABLE_NAME
              value: chaos-platform-experiment-history
            - name: AWS_REGION
              value: ap-northeast-1
            - name: FIS_TEMPLATE_SERVICE_A
              value: PLACEHOLDER_FIS_TEMPLATE_SERVICE_A
            - name: FIS_TEMPLATE_SERVICE_B
              value: PLACEHOLDER_FIS_TEMPLATE_SERVICE_B
            - name: FIS_TEMPLATE_POD_KILL_SERVICE_B
              value: PLACEHOLDER_FIS_TEMPLATE_POD_KILL_SERVICE_B
            - name: FIS_TEMPLATE_POD_KILL_SERVICE_C
              value: PLACEHOLDER_FIS_TEMPLATE_POD_KILL_SERVICE_C
            - name: FIS_TEMPLATE_CPU_STRESS_SERVICE_B
              value: PLACEHOLDER_FIS_TEMPLATE_CPU_STRESS_SERVICE_B
            - name: FIS_TEMPLATE_CPU_STRESS_SERVICE_C
              value: PLACEHOLDER_FIS_TEMPLATE_CPU_STRESS_SERVICE_C
            - name: FIS_TEMPLATE_MEMORY_STRESS_SERVICE_B
              value: PLACEHOLDER_FIS_TEMPLATE_MEMORY_STRESS_SERVICE_B
            - name: FIS_TEMPLATE_MEMORY_STRESS_SERVICE_C
              value: PLACEHOLDER_FIS_TEMPLATE_MEMORY_STRESS_SERVICE_C
          resources:
            requests:
              cpu: "64m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"
