# Ingress — service-b (ADR 012: CloudFront → ALB(internet-facing) → service-b)
# CHAOS_ALB_LOGS_BUCKET / CLOUDFRONT_ORIGIN_SECRET は terraform apply 後に CI/CD で置換する
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-b
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-attributes: "access_logs.s3.enabled=true,access_logs.s3.bucket=CHAOS_ALB_LOGS_BUCKET,access_logs.s3.prefix=service-b"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # CloudFront origin 認証: X-Origin-Verify ヘッダーがない場合はルーティングしない
    alb.ingress.kubernetes.io/conditions.service-b: '[{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Verify","values":["CLOUDFRONT_ORIGIN_SECRET"]}}]'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-b
                port:
                  number: 8000
