# NetworkPolicy — ADR 012
# VPC CNI の enableNetworkPolicy: true が有効になっていないと機能しない
---
# ① Default Deny All — default namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ① Default Deny All — chaos namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: chaos
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ② service-a: Ingress from ALB + service-b / Egress service-b + CoreDNS + AWS API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-a
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: service-a
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 10.0.1.0/24
        - podSelector:
            matchLabels:
              app: service-b
        - podSelector:
            matchLabels:
              app: traffic-generator
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: service-b
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# ③ service-b: Ingress from ALB + service-a / Egress service-c + CoreDNS + AWS API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-b
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: service-b
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 10.0.1.0/24
        - podSelector:
            matchLabels:
              app: service-a
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: service-c
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# ④ service-c: Ingress from service-b / Egress CoreDNS + CloudWatch X-Ray + AWS API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-c
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: service-c
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-b
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: amazon-cloudwatch
      ports:
        - protocol: UDP
          port: 2000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# ⑤ service-d: Ingress from service-a / Egress CoreDNS + CloudWatch X-Ray + AWS API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-d
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: service-d
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-a
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: amazon-cloudwatch
      ports:
        - protocol: UDP
          port: 2000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# ⑥ metrics-server: K8s API (443) + kubelet (10250) + CoreDNS へのアクセスを許可
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
  namespace: default
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 10250
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ⑥ FIS Pod: experimentId ラベルを持つ Pod に AWS FIS control plane への heartbeat を許可
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fis-agent
  namespace: default
spec:
  podSelector:
    matchExpressions:
      - key: experimentId
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
---
# ⑦ traffic-generator: Egress service-a:8000 (ClusterIP CIDR + pod CIDR) + CoreDNS
# VPC CNI の podSelector は ClusterIP を透過しないため ipBlock で service CIDR と VPC CIDR を許可
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traffic-generator
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: traffic-generator
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ④ chaos-agent: Egress K8s API (VPC) + AWS API (NAT) + CoreDNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chaos-agent
  namespace: chaos
spec:
  podSelector:
    matchLabels:
      app: chaos-agent
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
