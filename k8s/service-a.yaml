apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: default
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: service-a
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: service-a
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: service-a
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-service-b-egress
        - name: envoy-tmp
          emptyDir: {}
      containers:
        - name: service-a
          image: 203553641035.dkr.ecr.ap-northeast-1.amazonaws.com/chaos-platform/service-a:latest
          ports:
            - containerPort: 8000
          env:
            - name: FAULT_RATE
              value: "0.0"
            - name: SERVICE_B_INTERNAL_URL
              value: "http://localhost:9001"
            - name: CORS_ORIGINS
              value: "https://d36zpc4drlt9c4.cloudfront.net,http://localhost:5173"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "256m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "256Mi"

        - name: envoy
          image: envoyproxy/envoy:v1.31.0
          args: ["--config-path", "/etc/envoy/envoy.yaml", "--disable-hot-restart"]
          ports:
            - containerPort: 9001
              name: proxy
          securityContext:
            runAsUser: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: envoy-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: service-a
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
