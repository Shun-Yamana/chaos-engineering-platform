# Envoy sidecar config — service-a Pod
# localhost:9001 → service-b:8000
# timeout: 200ms, outlier_detection: eject after 5 consecutive local failures (timeout)

apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-service-b-egress
  namespace: default
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
      - name: service_b_egress
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 9001
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: service_b_egress
              route_config:
                name: service_b_route
                virtual_hosts:
                - name: service_b
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: service_b_cluster
                      timeout: 0.2s   # 200ms: service-a /aggregate の保護閾値
                      retry_policy:
                        retry_on: "connect-failure,reset"
                        num_retries: 1
                        per_try_timeout: 0.1s   # 100ms = route_timeout / (num_retries+1)
              http_filters:
              - name: envoy.filters.http.fault
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                  abort:
                    http_status: 500
                    percentage:
                      numerator: 0
                      denominator: HUNDRED
                  delay:
                    fixed_delay: 1s
                    percentage:
                      numerator: 0
                      denominator: HUNDRED
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: service_b_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        dns_refresh_rate: 5s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: service_b_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: service-b
                    port_value: 8000
        # outlier_detection: タイムアウト連続発生で service-b endpoint を一時 eject
        # split_external_local_origin_errors: true でタイムアウト（local origin failure）を外部 5xx と分離して追跡
        outlier_detection:
          split_external_local_origin_errors: true
          consecutive_local_origin_failure: 5
          consecutive_5xx: 5
          interval: 10s
          base_ejection_time: 30s
          max_ejection_percent: 100
        # circuit_breakers: pending request / connection / retry 上限で過負荷時の fail fast
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 50
            max_requests: 100
            max_retries: 2
---
# Envoy sidecar config — service-b Pod
# localhost:9002 → service-c:8000
# timeout: 500ms, service-c はレビュー集計（非クリティカル）
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-service-c-egress
  namespace: default
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9902

    static_resources:
      listeners:
      - name: service_c_egress
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 9002
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: service_c_egress
              route_config:
                name: service_c_route
                virtual_hosts:
                - name: service_c
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: service_c_cluster
                      timeout: 0.5s   # 500ms: service-b の service-c 呼び出し保護閾値
              http_filters:
              - name: envoy.filters.http.fault
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                  abort:
                    http_status: 500
                    percentage:
                      numerator: 0
                      denominator: HUNDRED
                  delay:
                    fixed_delay: 1s
                    percentage:
                      numerator: 0
                      denominator: HUNDRED
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: service_c_cluster
        connect_timeout: 0.25s
        type: STRICT_DNS
        dns_refresh_rate: 5s
        lb_policy: ROUND_ROBIN
        # max_connection_duration: 接続を定期的に更新することで
        # HTTPChaos tproxy が既存 keepalive 接続を素通りする問題を防ぐ
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            common_http_protocol_options:
              max_connection_duration: 5s
        load_assignment:
          cluster_name: service_c_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: service-c
                    port_value: 8000
        outlier_detection:
          split_external_local_origin_errors: true
          consecutive_local_origin_failure: 5
          consecutive_5xx: 5
          interval: 10s
          base_ejection_time: 30s
          max_ejection_percent: 100
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 50
            max_requests: 100
            max_retries: 2
