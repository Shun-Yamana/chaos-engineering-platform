name: Deploy Services

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'k8s/**'

env:
  AWS_REGION: 'ap-northeast-1'
  AWS_ACCOUNT_ID: '203553641035'
  EKS_CLUSTER: 'chaos-platform-cluster'

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/chaos-platform/${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/chaos-platform/${{ matrix.service }}:latest \
            ./services/${{ matrix.service }}

          docker push $ECR_REGISTRY/chaos-platform/${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/chaos-platform/${{ matrix.service }}:latest

          echo "image=$ECR_REGISTRY/chaos-platform/${{ matrix.service }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build

    outputs:
      image: ${{ steps.build.outputs.image }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy service-a
        env:
          IMAGE: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/chaos-platform/service-a:${{ github.sha }}
        run: |
          sed "s|SERVICE_A_IMAGE|$IMAGE|g" k8s/service-a.yaml | kubectl apply -f -
          kubectl rollout status deployment/service-a --timeout=120s

      - name: Deploy service-b
        env:
          IMAGE: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/chaos-platform/service-b:${{ github.sha }}
        run: |
          sed "s|SERVICE_B_IMAGE|$IMAGE|g" k8s/service-b.yaml | kubectl apply -f -
          kubectl rollout status deployment/service-b --timeout=120s
