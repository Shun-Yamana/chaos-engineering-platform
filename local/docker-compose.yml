services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.0
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: local/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      EXPERIMENT_TABLE: chaos-platform-experiment-history
      SLO_TABLE: chaos-platform-slo-definitions
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
    depends_on:
      dynamodb-local:
        condition: service_healthy
