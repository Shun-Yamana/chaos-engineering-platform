apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: chaos-platform/service-b:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_A_URL
              value: "http://service-a/"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
    - port: 8000
      targetPort: 8000
