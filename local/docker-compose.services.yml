services:
  service-c:
    build:
      context: ../services/service-c
    ports:
      - "8002:8000"
    environment:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  service-d:
    build:
      context: ../services/service-d
    ports:
      - "8003:8000"
    environment:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  service-b:
    build:
      context: ../services/service-b
    ports:
      - "8001:8000"
    environment:
      SERVICE_C_INTERNAL_URL: http://service-c:8000
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
    depends_on:
      service-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  service-a:
    build:
      context: ../services/service-a
    ports:
      - "8080:8000"
    environment:
      SERVICE_B_INTERNAL_URL: http://service-b:8000
      SERVICE_D_INTERNAL_URL: http://service-d:8000
      CORS_ORIGINS: "*"
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_XRAY_CONTEXT_MISSING: LOG_ERROR
    depends_on:
      service-b:
        condition: service_healthy
      service-d:
        condition: service_healthy
